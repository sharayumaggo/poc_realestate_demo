version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: RealEstateDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./RealEstateApi
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=RealEstateDb;Username=postgres;Password=password
    restart: on-failure

  frontend:
    build:
      context: ./RealEstateFrontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data: